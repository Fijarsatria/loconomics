# Render Blueprint - backend Loconomics.
#
# Cara pakai: Render Dashboard -> New -> Blueprint -> pilih repo ini. Render
# membaca berkas ini dan membuat layanannya. Nilai rahasia TIDAK ada di sini
# (`sync: false` berarti "tanyakan ke saya di dashboard"), dan itu disengaja:
# berkas ini ikut ter-commit ke repo publik.
#
# Yang perlu disadari soal free tier, karena ia menentukan cara demo dijalankan:
# layanan free TIDUR sesudah 15 menit tidak ada permintaan, dan bangunnya
# memakan puluhan detik. Mitigasinya dikerjakan di empat tempat -
#   1. gaya basemap disajikan sebagai berkas STATIS dari frontend
#      (frontend/public/basemap/*.json), jadi peta tetap tergambar walau
#      backend masih bangun;
#   2. `/health` sengaja tidak menyentuh basis data, supaya health check Render
#      tidak menghabiskan koneksi Supabase free tier;
#   3. `bangunkan()` di frontend/src/main.tsx mengetuk /health saat halaman
#      DIBUKA - puluhan detik sebelum peta membutuhkannya, karena gerbang di
#      antaranya memang dibuat untuk dibaca. Cold start dibayar oleh waktu
#      yang sudah dihabiskan orang membaca, bukan oleh waktu tunggunya;
#   4. layar pembuka MENCOBA ULANG alih-alih menyimpulkan backend mati, dan
#      membedakan keduanya: habis waktu / 502-504 ditunggu, sambungan yang
#      ditolak tidak. Lihat `tungguMesinData` di components/Pembuka.tsx.
# Sisanya tetap manual: panggil backend beberapa menit sebelum penjurian.

services:
  - type: web
    name: loconomics-api
    runtime: python
    plan: free
    # Jakarta tidak tersedia di free tier; Singapura yang terdekat.
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Murah dan tidak menyentuh basis data - lihat docstring app/api/meta.py.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- Rahasia. Diisi di dashboard, tidak pernah di repo. ---------------
      - key: DATABASE_URL
        sync: false          # Supabase, mode "Transaction pooler"
      - key: MAPID_MAPS_API_KEY
        sync: false          # basemap; dipakai HANYA untuk mengambil style.json
      - key: MAPID_DATA_API_KEY
        sync: false          # data misi; backend-to-backend, tidak pernah ke peramban
      - key: LLM_API_KEY
        sync: false          # AI Consultant
      - key: ORS_API_KEY
        sync: false          # openrouteservice; dipakai pipeline, bukan saat melayani

      # Kunci penandatangan tiket sesi. TIDAK BOLEH hilang di produksi, dan
      # hilangnya gagal DIAM: `_kunci()` di app/core/akun.py dipanggil saat
      # MELAYANI permintaan, bukan saat impor - jadi server tetap naik, health
      # check tetap hijau, peta tetap tergambar, dan yang mati cuma
      # daftar/masuk. Juri yang membuat akun menerima 500 di layar pertama
      # yang menuntut identitas.
      #
      # `generateValue` dan bukan `sync: false`: nilainya tidak perlu diketahui
      # siapa pun, jadi satu isian manual yang bisa terlupa lebih baik
      # ditiadakan daripada didokumentasikan. Render membangkitkannya sekali
      # dan menyimpannya - tiket tidak hangus tiap deploy.
      - key: AUTH_SECRET
        generateValue: true

      # --- Bukan rahasia -----------------------------------------------------
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-5
      - key: LLM_PLAFON_HARIAN_USD
        value: "2.0"
      - key: LINGKUNGAN
        value: produksi
      # Domain frontend. WAJIB disetel ulang di dashboard begitu subdomain dari
      # panitia MAPID keluar - CORS yang salah membuat SELURUH panggilan data
      # gagal dari peramban sementara curl tetap berhasil, dan itu jenis
      # kegagalan yang paling lama dikejar.
      #
      # Yang tertulis di sini sebelumnya `loconomics.pages.dev` - domain
      # Cloudflare yang tidak pernah jadi dipakai. Terbitannya GitHub Pages,
      # dan ASALNYA tidak memuat jalur: `https://fijarsatria.github.io`, bukan
      # `.../loconomics/`. Diuji: dengan daftar yang lama, permintaan dari asal
      # yang sebenarnya pulang TANPA `access-control-allow-origin` sama sekali
      # dan preflight-nya dijawab 400 - persis kegagalan yang diperingatkan
      # komentar di atas, sudah tertulis di berkasnya sendiri selama ini.
      #
      # Asal yang tidak kita miliki sengaja TIDAK didaftarkan. Produk ini punya
      # akun dan fitur berbayar, jadi asal asing di daftar ini bukan sekadar
      # baris mati - ia izin memanggil API ini dengan tiket orang lain.
      - key: CORS_ORIGINS
        value: "https://fijarsatria.github.io,http://localhost:5173,http://localhost:4173"
