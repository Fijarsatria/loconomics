# Terbitkan backend ke Azure App Service.
#
# Kenapa Azure dan bukan Render: Render menuntut kartu, dan tim ini tidak
# punya. Azure for Students memberi $100 selama 12 bulan tanpa kartu sama
# sekali - cukup email kampus (@student.telkomuniversity.ac.id). DigitalOcean
# lewat GitHub Student Pack sempat jadi kandidat dan sudah TUTUP sejak
# 1 Agustus 2026.
#
# Satu syarat yang tidak tertulis di halaman pricing mana pun, dan yang
# menggugurkan kandidat lain: backend ini menghubungi Supabase Postgres di
# port 6543. Hugging Face Spaces - yang tampak paling menarik karena gratis
# dan 16 GB RAM - MEMBLOKIR seluruh outbound selain port 80/443/8080, jadi ia
# tidak akan pernah bisa menyentuh basis datanya. Azure App Service tidak
# membatasi outbound TCP. Periksa syarat ini lebih dulu di kandidat mana pun.
#
# ---------------------------------------------------------------------------
# Yang harus disiapkan SEKALI di Azure Portal, sebelum alur ini bisa jalan
# ---------------------------------------------------------------------------
#
# 1. App Service baru: Linux, Python 3.11, region **Southeast Asia** (Singapura;
#    paling dekat ke Jabodetabek dan ke Supabase).
#
# 2. Configuration -> Application settings, isi persis nama-nama ini:
#
#      DATABASE_URL            Supabase, mode "Transaction pooler"
#      AUTH_SECRET             WAJIB. Buat dengan:
#                                python -c "import secrets;print(secrets.token_urlsafe(48))"
#                              Tanpa ini server tetap NAIK dan health check tetap
#                              HIJAU - yang mati cuma daftar/masuk, karena kunci
#                              tiket dibaca saat MELAYANI, bukan saat impor.
#      CORS_ORIGINS            https://fijarsatria.github.io
#                              Asal saja, TANPA jalur. Bukan .../loconomics/.
#      LINGKUNGAN              produksi
#      MAPID_MAPS_API_KEY      basemap; hanya untuk mengambil style.json
#      MAPID_DATA_API_KEY      data misi; tidak pernah ke peramban
#      LLM_API_KEY             Konsultan AI. Boleh kosong dulu - /ai/tanya
#                              menjawab 501 dengan pesan yang jujur
#      LLM_PROVIDER            anthropic ATAU gemini
#      LLM_MODEL               claude-opus-5 (anthropic) atau
#                              gemini-3-flash-preview (gemini)
#      LLM_PLAFON_HARIAN_USD   2.0
#
#    UNTUK PAMERAN 3-4 SEPTEMBER 2026: dipakai `gemini`, bukan `anthropic`,
#    lewat adapter `backend/app/core/llm_gemini.py`. `api/ai.py` sendiri
#    tidak tahu bedanya - keduanya bicara dalam bentuk yang sama, dan
#    `LLM_PROVIDER` yang memilih di `app/core/llm.py::klien()`.
#
#    Model bawaan `gemini-flash-latest` TERUKUR sering 503 (kelebihan beban
#    di sisi Google, bukan kunci atau kuota kita) - adapter sudah mencoba
#    tiga model cadangan sendiri (lihat MODEL_CADANGAN di llm_gemini.py), tapi
#    kalau AI Consultant terasa lambat/mati saat pameran, ganti LLM_MODEL di
#    Azure App Settings ke salah satu yang terbukti responsif saat diuji:
#    `gemini-3-flash-preview` atau `gemini-flash-lite-latest`. Tidak perlu
#    deploy ulang - App Settings dibaca ulang saat proses Python berikutnya
#    start, restart App Service saja dari portal sudah cukup.
#
#    JANGAN commit kunci API Gemini ke repo mana pun. Ia cuma boleh hidup di
#    Azure App Settings dan di backend/.env lokal (yang di-gitignore).
#      SCM_DO_BUILD_DURING_DEPLOYMENT   true
#                              Tanpa ini Oryx tidak memasang requirements.txt
#                              dan aplikasinya naik tanpa satu pun dependensi
#
#    Itu SELURUH `Settings` yang dibaca backend, kecuali satu - dan yang satu
#    itu sengaja tidak ada di sini:
#
#      ORS_API_KEY   JANGAN disetel di Azure. `render.yaml` mendaftarkannya dan
#                    itu keliru: satu-satunya pemakainya `pipeline/rute_ors.py`,
#                    yang dijalankan MANUAL dari mesin pengembang. Backend tidak
#                    pernah memanggil openrouteservice saat melayani - ia cuma
#                    membaca tabel `hex_routes` dan `catchment_areas`. Kuota
#                    gratisnya 2.000 permintaan per hari untuk seluruh akun,
#                    jadi menaruhnya di satu tempat lagi menambah risiko tanpa
#                    menambah satu pun kemampuan. Ia tetap hidup di
#                    `backend/.env` lokal, tempat pipeline membacanya.
#
#    `PYTHON_VERSION` juga tidak ada, dan itu bukan kelalaian: di Render ia app
#    setting, di Azure ia runtime stack yang dipilih di langkah 1.
#
# 3. Configuration -> General settings -> Startup Command:
#
#      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
#
# 4. Deployment Center -> Manage publish profile -> Download, lalu tempel
#    isinya sebagai secret repositori bernama AZURE_WEBAPP_PUBLISH_PROFILE.
#
# 5. Settings -> Variables -> AZURE_WEBAPP_NAME = nama app service-nya.
#
# 6. SESUDAH alur ini hijau dan pemeriksaan di bawah lolos, barulah setel
#    variabel VITE_API_BASE_URL (lihat pages.yml) dan jalankan ulang alur
#    frontend. Jangan dibalik: mengarahkan situs publik ke backend yang belum
#    ada membuatnya mundur.
#
# Catatan biaya, karena ia menentukan pengalaman juri: tier F1 (gratis, tidak
# memotong kredit) TIDAK punya Always On, jadi aplikasinya menganggur lalu
# dingin. Frontend sudah menanganinya - `bangunkan()` mengetuk /health sejak
# halaman dibuka dan layar pembuka mencoba ulang - tetapi untuk minggu
# penjurian naikkan ke B1 dan nyalakan Always On. B1 sekitar $13/bulan, jadi
# kredit $100 cukup untuk tujuh bulan.

name: Terbitkan backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-azure.yml'
  workflow_dispatch:

# Satu penerbitan pada satu waktu, dengan alasan yang sama dengan pages.yml:
# penerbitan yang dibatalkan di tengah jalan meninggalkan keadaan separuh.
concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Pasang dependensi
        working-directory: backend
        run: pip install -r requirements.txt

      # Dua berkas uji, bukan kelimanya, dan itu disengaja. `test_akun.py` dan
      # `smoke_api.py` menuntut Supabase; `test_aturan.py` mengimpor
      # `pipeline/config.py` untuk memeriksa konsistensi lintas berkas dan
      # menyeret dependensi pipeline. Yang tersisa dua ini - keduanya
      # backend-saja dan tanpa basis data, dan keduanya sudah diuji benar-benar
      # lolos di lingkungan tanpa `.env`.
      #
      # DATABASE_URL diisi nilai karangan karena `Settings` mewajibkannya saat
      # IMPOR. Tidak ada yang menyambung: `create_engine` tidak menghubungi
      # apa pun sampai kueri pertama.
      - name: Uji yang tidak butuh basis data
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://uji:uji@localhost:5432/uji
        run: |
          python tests/test_infra.py
          python tests/test_ai_loop.py

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

      # Inilah langkah yang paling berharga di berkas ini.
      #
      # Berkas deployment Render sebelumnya memuat TIGA kerusakan sekaligus -
      # CORS yang tidak bisa diurai, asal yang salah, AUTH_SECRET yang hilang -
      # dan tidak satu pun tertangkap 497 asersi, karena semuanya berjalan di
      # mesin yang punya `.env` yang kebetulan benar. Satu-satunya yang bisa
      # membantahnya adalah terbitan yang sudah hidup, ditanya dari luar.
      #
      # Tiga pertanyaan, dan ketiganya menutup satu kerusakan nyata:
      #   1. naik sama sekali?          -> CORS yang tidak terurai membunuh impor
      #   2. asal frontend diizinkan?   -> asal yang salah lolos curl, gagal di peramban
      #   3. AUTH_SECRET terpasang?     -> tanpa itu HANYA daftar/masuk yang mati
      - name: Periksa terbitan yang baru naik
        env:
          URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
          ASAL: https://fijarsatria.github.io
        run: |
          set -euo pipefail

          # App Service butuh waktu memuat ulang container sesudah deploy.
          echo "Menunggu $URL bangun..."
          for i in $(seq 1 30); do
            kode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/health" || echo 000)
            [ "$kode" = "200" ] && break
            sleep 10
          done

          kode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/health")
          echo "1. /health -> $kode"
          [ "$kode" = "200" ] || { echo "GAGAL: backend tidak naik"; exit 1; }

          acao=$(curl -s -D - -o /dev/null --max-time 30 -H "Origin: $ASAL" "$URL/meta/siap" \
                 | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2- || true)
          echo "2. allow-origin untuk $ASAL -> ${acao:-TIDAK ADA}"
          [ "$acao" = "$ASAL" ] || {
            echo "GAGAL: peramban akan memblokir SELURUH panggilan data."
            echo "Betulkan CORS_ORIGINS di Application settings - asal saja, tanpa jalur."
            exit 1
          }

          # Tiket karangan berbentuk sah ke endpoint yang menuntut identitas.
          #
          # Percobaan pertama memakai `POST /akun/masuk` dengan sandi salah, dan
          # itu TIDAK membuktikan apa pun: `masuk` menolak kredensialnya dengan
          # 401 SEBELUM `_kunci()` pernah dipanggil, jadi ia menjawab 401 baik
          # AUTH_SECRET ada maupun tidak. Diuji, dan itu sebabnya diganti.
          #
          # `a.b.c` dipilih justru karena bentuknya: tiga bagian dipisah titik,
          # yang cukup untuk melewati pemeriksaan bentuk dan sampai ke HMAC -
          # tempat kuncinya benar-benar dibaca. Nol baris dibuat di basis data.
          #
          #   401 = kunci ada, tanda tangannya saja yang tidak cocok. Benar.
          #   500 = `_kunci()` melempar. AUTH_SECRET tidak disetel.
          kode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                 -H 'Authorization: Bearer a.b.c' "$URL/akun/saya")
          echo "3. GET /akun/saya (tiket karangan) -> $kode"
          [ "$kode" = "401" ] || {
            echo "GAGAL: harusnya 401. 500 berarti AUTH_SECRET belum disetel"
            echo "di Application settings - dan yang mati HANYA daftar/masuk,"
            echo "jadi health check tetap hijau dan petanya tetap tergambar."
            exit 1
          }

          echo "Terbitan sehat."
