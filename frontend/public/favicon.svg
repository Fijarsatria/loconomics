<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Loconomics">
  <title>Loconomics</title>
  <!--
    Markah Loconomics.

    Sebelum 13 Sep 2026 berkas ini masih berisi logo VITE bawaan scaffold -
    bolt ungu-biru yang ikut terbit ke situs lomba sebagai favicon produk.
    Ketahuan saat mencari "logo Loconomics" untuk ditanam di laporan PDF.

    Bentuknya menyatakan tesis produknya sendiri, bukan hiasan: satu heksagon
    H3 (unit analisis), dan DI DALAMNYA satu blok yang menonjol - persis
    pertanyaan yang dijawab Loconomics, "di dalam petak selebar 350 m ini,
    sisi mana". Garis tipis yang menembusnya adalah jalur transit yang jadi
    sumbu seluruh skornya.

    Teal #2DE8C0 adalah warna produk yang sudah dipakai rute utama di peta
    (lihat WARNA_RUTE di lib/layer-peta.ts) - jadi markah ini memakai warna
    yang sudah dikenali orang dari petanya, bukan warna baru.
  -->
  <defs>
    <linearGradient id="loc-g" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DE8C0" />
      <stop offset="1" stop-color="#12836C" />
    </linearGradient>
  </defs>

  <path
    d="M24 3.2 42.0 13.6 42.0 34.4 24 44.8 6.0 34.4 6.0 13.6Z"
    fill="none"
    stroke="url(#loc-g)"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <path
    d="M6.0 31.2 19.2 23.6 28.8 29.1 42.0 21.5"
    fill="none"
    stroke="url(#loc-g)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.45"
  />

  <path d="M28.8 14.6 34.6 17.9 34.6 24.5 28.8 27.8 23.0 24.5 23.0 17.9Z" fill="url(#loc-g)" />
</svg>
